<html>
    <head>
        ordered list
    </head>
    <body>
        <h1> ORDERED LIST IN HTML</h1>
        <ol>
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ol>
        <hr>

        <ol type = "1">
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ol>
        <hr>

        <ol type="A">
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ol>
        <hr>

        <ol type="I">
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ol>
    </body>
</html>
