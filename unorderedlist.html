<html>
    <head>
        ordered list
    </head>
    <body>
        <h1> ORDERED LIST IN HTML</h1>
        <ul>
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ul>
        <hr>

        <ul type = square>
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ul>
        <hr>

        <ul type= circle>
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ul>
        <hr>

        <ul type=bullet>
            <li>APPLE</li>
            <li>BALL</li>
            <li>CAT</li>
            <li>DOG</li>
        </ul>
    </body>
</html>
